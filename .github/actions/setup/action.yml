name: Setup
description: Build job prerequisites (the runners have a C compiler); optionally relax ASLR for the ThreadSanitizer runtime tests
inputs:
  tsan:
    description: Prepare the runner for ThreadSanitizer runs (the runtime threading tests)
    default: 'false'
runs:
  using: composite
  steps:
    - name: Prepare ThreadSanitizer (Linux)
      if: inputs.tsan == 'true' && runner.os == 'Linux'
      shell: bash
      run: |
        # ThreadSanitizer cannot map its shadow memory with the runner's default ASLR entropy.
        sudo sysctl vm.mmap_rnd_bits=28
