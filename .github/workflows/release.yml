name: Release
# Prebuilt compilers on GitHub Releases: one tarball per platform, the portable C bootstrap seed and SHA256SUMS.
#   * push a tag `v0.4.0`, or
#   * run the workflow with `version: 0.4.0` (it creates the tag `v0.4.0` on the dispatched commit).
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without the leading v, e.g. 0.4.0'
        required: true
        type: string
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        env:
          INPUT: ${{ inputs.version }}
        run: |
          v="${INPUT:-${GITHUB_REF_NAME}}"
          v="${v#v}"
          if ! echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+.][0-9A-Za-z.-]+)?$'; then
            echo "not a version: '$v'"; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: linux-x64,   os: ubuntu-latest,    seed: true }
          - { target: linux-arm64, os: ubuntu-24.04-arm, seed: false }
          - { target: macos-arm64, os: macos-latest,     seed: false }
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # stage1 (JVM, own frontend) -> stage2 -> stage3, stage2 == stage3 (the release is the checked fixpoint)
      - name: Bootstrap
        working-directory: compiler
        run: ./gradlew :jvm-bridge:installDist --console=plain && ./bootstrap.sh "$RUNNER_TEMP/boot"
      - name: Package
        run: |
          flags=""
          if [ "${{ matrix.seed }}" = "true" ]; then flags="--seed"; fi
          scripts/package-release.sh "$VERSION" "${{ matrix.target }}" --work "$RUNNER_TEMP/boot" --out dist $flags
      - name: Smoke test the tarball
        run: |
          d="$(mktemp -d)"
          MINI_HOME="$d/home" MINI_TARBALL="$PWD/dist/mini-$VERSION-${{ matrix.target }}.tar.gz" ./install.sh
          "$d/home/bin/minic" build examples/hello.kt -o "$d/hello"
          "$d/hello" | tee "$d/out.txt"
          grep -q 'Hello, Mini!' "$d/out.txt"
          # the project tool (a native binary, no JVM): new, build, run, test, check
          mkdir "$d/proj" && cd "$d/proj"
          "$d/home/bin/mini" new demo && cd demo
          "$d/home/bin/mini" build && "$d/home/bin/mini" run | grep -q 'Hello, world!'
          "$d/home/bin/mini" test && "$d/home/bin/mini" check
      # The seed alone (a C compiler) must give a stage0 that reproduces stage2 == stage3 and its own C.
      - name: Verify the bootstrap seed
        if: matrix.seed
        run: |
          d="$(mktemp -d)"
          tar -xzf "dist/mini-$VERSION-bootstrap-c.tar.gz" -C "$d"
          "$d/mini-$VERSION-bootstrap-c/build.sh" "$d/stage0"
          compiler/bootstrap.sh --stage0 "$d/stage0" "$d/seedboot"
          cmp "$d/seedboot/stage1.c" "$d/mini-$VERSION-bootstrap-c/minic.c"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: Checksums
        working-directory: dist
        run: sha256sum *.tar.gz | tee SHA256SUMS
      - name: Release notes
        run: |
          tag="v$VERSION"
          prev="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | grep -vx "$tag" | head -n 1 || true)"
          if [ -n "$prev" ]; then
            {
              echo "Changes since $prev:"
              echo
              git log --no-merges --pretty='* %s (%h)' "$prev..${GITHUB_SHA}"
            } > notes.md
          else
            cat > notes.md <<'EOF'
          First prebuilt release of Mini: Kotlin compiled to native code (Kotlin to C17 to a native binary), with a memory model the compiler can check.

          **What it is**
          * The compiler is self-hosted: `minic-native` (own parser, type checker, lowering and C backend, written in Kotlin) compiles itself, and stage 2 and stage 3 of the bootstrap are byte-identical. No JDK is needed to use it.
          * Memory model: reference counting by default (with RC elision), allocators as context parameters (Arena, Heap, Pool), and opt-in Strict mode (`@file:MemoryMode(Mode.Strict)`) where leaks, double frees and use-after-free are compile errors.
          * Kotlin 1:1: classes, sealed/data/enum/object, interfaces, generics, lambdas, inline/reified, exceptions, extensions, ranges, collections and large parts of the stdlib. The stdlib is Kotlin source and ships in the tarball.

          **What is in the release**
          * `mini-<version>-<target>.tar.gz` for linux-x64, linux-arm64 and macos-arm64: `bin/mini` (the project tool: `mini new`, `build`, `run`, `test`, `check`; itself compiled by Mini, no JVM), `bin/minic` (`minic build foo.kt -o foo`), `bin/minic-native`, `lib/libminirt.a`, `include/`, `stdlib/`.
          * `mini-<version>-bootstrap-c.tar.gz`: the generated C of the compiler plus the runtime sources; a C compiler alone builds a working compiler from it.
          * `SHA256SUMS`. Install with `curl -fsSL https://raw.githubusercontent.com/HenrySchwerdt/mini/main/install.sh | sh`.

          **Known gaps**
          * A C compiler (clang or gcc) is still needed at build time; `minic` is a thin wrapper around `minic-native` and `cc`.
                    * No Windows, no coroutines or async IO, no reflection or JSON yet. Strict-mode codegen and the stdlib on the memory model are in progress.
          EOF
          fi
          cat notes.md
      - name: Create the release
        run: |
          tag="v$VERSION"
          pre=""
          case "$VERSION" in *-*) pre="--prerelease" ;; esac
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists"; exit 1
          fi
          # --target creates the tag on this commit when it does not exist yet (workflow_dispatch)
          gh release create "$tag" dist/*.tar.gz dist/SHA256SUMS \
            --title "Mini $VERSION" --notes-file notes.md --target "$GITHUB_SHA" $pre
