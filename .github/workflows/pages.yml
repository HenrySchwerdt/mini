name: Documentation site

# Builds the VitePress site in website/ and deploys it to GitHub Pages (https://henryschwerdt.github.io/mini/).
# Pull requests run the same checks and build the site, but do not deploy, and only when the site itself
# changes. Compiler changes that break a sample or make a generated page stale show up on the push to main.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'website/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The in-browser toolchain (minic.wasm, runtime, worker, prebuilt clang modules): only on pushes to main, cached by the hash of its
  # inputs (see wasm-toolchain.yml). Pull requests skip it and the site then says that Run is not available.
  toolchain:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/wasm-toolchain.yml

  build:
    needs: toolchain
    # a skipped toolchain job (pull request) must not skip the build
    if: ${{ !cancelled() && (needs.toolchain.result == 'success' || needs.toolchain.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Build the compiler
        working-directory: compiler
        run: ./gradlew installDist --console=plain

      - name: Install site dependencies (the snippet extraction below needs them)
        working-directory: website
        run: npm ci

      # Every code listing on the site is a file under website/samples, or a runnable fence in a markdown page (extracted by
      # website/scripts/extract-snippets.mjs). Build and run them (or check them, for the memory-model samples) and compare with the
      # expected output / diagnostic code.
      - name: Check the code samples
        run: website/scripts/check-samples.sh

      # The diagnostics pages and the compiler-output listings are generated by running the real compiler.
      - name: Regenerate diagnostics pages
        run: node website/scripts/gen-diagnostics.mjs

      - name: Regenerate compiler-output listings
        run: website/scripts/gen-internals.sh

      - name: Generated pages must be committed
        if: github.event_name == 'pull_request'
        run: |
          if [ -n "$(git status --porcelain -- website)" ]; then
            git status --short -- website
            echo "::error::Generated docs are stale. Run 'node website/scripts/gen-diagnostics.mjs' and 'website/scripts/gen-internals.sh' and commit the result."
            exit 1
          fi

      - name: Playground unit tests and typecheck
        working-directory: website
        run: npm test && npm run typecheck

      - name: Download the wasm toolchain
        if: github.event_name != 'pull_request'
        uses: actions/download-artifact@v4
        with:
          name: wasm-toolchain
          path: wasm-toolchain

      # website/public/toolchain/: manifest.json, the module worker and the versioned wasm files (about 107 MB, not committed).
      - name: Unpack the wasm toolchain into the site
        if: github.event_name != 'pull_request'
        run: tar -xzf wasm-toolchain/wasm-toolchain-site.tar.gz -C website/public

      # VitePress fails the build on dead links.
      - name: Build the site
        working-directory: website
        run: npm run docs:build

      # The same cells through the in-browser toolchain (the real worker and wasm files, in node): what the Run and Check buttons do.
      - name: Run the documentation cells with the wasm toolchain
        if: github.event_name != 'pull_request'
        working-directory: website
        run: node scripts/run-snippets-wasm.mjs public/toolchain --keep-going

      # Headless Chromium against the built site: playground, checker, run, notebook, "Open in playground".
      - name: Browser end-to-end test
        if: github.event_name != 'pull_request'
        working-directory: website
        run: |
          npx playwright install --with-deps chromium
          node scripts/e2e-playground.mjs --shots "$RUNNER_TEMP/e2e-shots"

      - name: Upload the end-to-end screenshots
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: ${{ runner.temp }}/e2e-shots
          if-no-files-found: ignore

      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: website/.vitepress/dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
