name: Documentation site

# Builds the VitePress site in website/ and deploys it to GitHub Pages (https://henryschwerdt.github.io/mini/).
# Pull requests run the same checks and build the site, but do not deploy, and only when the site itself
# changes. Compiler changes that break a sample or make a generated page stale show up on the push to main.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'website/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Build the compiler
        working-directory: compiler
        run: ./gradlew installDist --console=plain

      # Every code listing on the site is a file under website/samples. Build and run them (or check
      # them, for the memory-model samples) and compare with the expected output / diagnostic code.
      - name: Check the code samples
        run: website/scripts/check-samples.sh

      # The diagnostics pages and the compiler-output listings are generated by running the real compiler.
      - name: Regenerate diagnostics pages
        run: node website/scripts/gen-diagnostics.mjs

      - name: Regenerate compiler-output listings
        run: website/scripts/gen-internals.sh

      - name: Generated pages must be committed
        if: github.event_name == 'pull_request'
        run: |
          if [ -n "$(git status --porcelain -- website)" ]; then
            git status --short -- website
            echo "::error::Generated docs are stale. Run 'node website/scripts/gen-diagnostics.mjs' and 'website/scripts/gen-internals.sh' and commit the result."
            exit 1
          fi

      - name: Install site dependencies
        working-directory: website
        run: npm ci

      - name: Playground unit tests and typecheck
        working-directory: website
        run: npm test && npm run typecheck

      # VitePress fails the build on dead links.
      - name: Build the site
        working-directory: website
        run: npm run docs:build

      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: website/.vitepress/dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
