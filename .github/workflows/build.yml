name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# A new push to a pull request cancels the run of its previous head.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Which parts changed: docs-only changes skip the builds.
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      runtime: ${{ steps.filter.outputs.runtime }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            runtime:
              - 'runtime/**'
              - '.github/workflows/build.yml'
            code:
              - 'compiler/**'
              - 'stdlib/**'
              - 'stdlib-test/**'
              - 'tools/**'
              - 'runtime/**'
              - 'examples/**'
              - 'minic'
              - 'mini'
              - 'install.sh'
              - 'scripts/**'
              - '.github/workflows/build.yml'

  # libminirt under ASan/UBSan and TSan.
  runtime:
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          libuv: 'true'
      - name: Runtime tests (ASan, UBSan, TSan)
        run: runtime/run_tests.sh

  # Compiler tests, split into shards that run in parallel. No JVM and no Gradle: every shard builds the native toolchain
  # (scripts/ci-toolchain.sh: the latest release's compiler builds the compiler, runtime and `mini` of this checkout, ~2 min)
  # and runs `mini test` / scripts/test-e2e.sh. The K2 cross-checks live in k2-oracle.yml (nightly, not per PR).
  compiler:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        # All shards on Linux; macOS runs every shard on main and only the platform-sensitive
        # ones (e2e, modules) on pull requests, since macOS runners are scarce.
        os: ${{ fromJSON(github.ref == 'refs/heads/main' && '["ubuntu-latest","macos-latest"]' || '["ubuntu-latest"]') }}
        # modules: purity + `mini test` of backend, frontend, native-driver (103 tests); mini-tool: `mini test` of the tool (72, slow: real builds);
        # e2e: scripts/test-e2e.sh (C backend, sanitizers, memory corpus); llvm: LLVM backend suites, the LLVM bootstrap and the LLVM C API;
        # stage0: bootstrap from the release, stage2 == stage3, then the `mini` smoke test.
        shard: ${{ fromJSON('["modules","mini-tool","e2e","llvm","stage0"]') }}
        include: ${{ fromJSON(github.ref == 'refs/heads/main' && '[]' || '[{"os":"macos-latest","shard":"e2e"},{"os":"macos-latest","shard":"modules"}]') }}
    name: compiler (${{ matrix.shard }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Toolchain
        if: matrix.shard != 'stage0'
        run: scripts/ci-toolchain.sh
      - name: Tests (${{ matrix.shard }})
        run: |
          case "${{ matrix.shard }}" in
            modules)
              scripts/check-purity.sh
              (cd compiler && ../build/native/bin/mini test -p backend -p frontend -p native-driver) ;;
            mini-tool)
              (cd compiler && ../build/native/bin/mini test -p mini-tool) ;;
            e2e)
              scripts/test-e2e.sh ;;
            llvm)
              # LLVM C API headers and libLLVM for the in-memory backend (and the ORC JIT).
              if [ "$RUNNER_OS" = Linux ]; then
                sudo apt-get install -y -qq llvm-18-dev >/dev/null
                echo "/usr/lib/llvm-18/bin" >> "$GITHUB_PATH"; export PATH="/usr/lib/llvm-18/bin:$PATH"
                llvm-config --version
              fi
              (cd compiler && ../build/native/bin/mini build -p native-driver)
              export NATIVE_DRIVER="$PWD/compiler/build/debug/native-driver"
              scripts/test-e2e.sh --suite llvm --suite llvm-leak --suite llvm-variants
              if [ "$RUNNER_OS" = Linux ]; then
                # bootstrap through the LLVM backend, then through the LLVM C API; the API compiler runs the llvm-api suite
                scripts/ci-stage0.sh "$RUNNER_TEMP/boot-llvm" --backend=llvm
                scripts/ci-stage0.sh "$RUNNER_TEMP/boot-api" --backend=llvm-api
                MINIC_API="$RUNNER_TEMP/boot-api/s0/stage3" scripts/test-e2e.sh --suite llvm-api
              fi ;;
            # B3 from the latest release: native stage0 -> stage1 -> stage2 -> stage3, stage2 == stage3 byte for byte.
            # Then the native `mini` project tool is built by that stage3 compiler and smoke-tested:
            # mini new, build, run, test, check.
            stage0)
              scripts/ci-stage0.sh "$RUNNER_TEMP/stage0" && scripts/ci-mini-smoke.sh "$RUNNER_TEMP/stage0" ;;
          esac

  # Single status for branch protection: green when every job that ran passed.
  ci-ok:
    if: always()
    needs: [changes, runtime, compiler]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          for r in "${{ needs.changes.result }}" "${{ needs.runtime.result }}" "${{ needs.compiler.result }}"; do
            case "$r" in success|skipped) ;; *) echo "a job ended with: $r"; exit 1 ;; esac
          done
