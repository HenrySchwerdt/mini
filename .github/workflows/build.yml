name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# A new push to a pull request cancels the run of its previous head.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Which parts changed: docs-only changes skip the builds.
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      runtime: ${{ steps.filter.outputs.runtime }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            runtime:
              - 'runtime/**'
              - '.github/workflows/build.yml'
            code:
              - 'compiler/**'
              - 'stdlib/**'
              - 'stdlib-test/**'
              - 'tools/**'
              - 'runtime/**'
              - 'examples/**'
              - 'minic'
              - 'mini'
              - 'install.sh'
              - 'scripts/**'
              - '.github/workflows/build.yml'

  # libminirt under ASan/UBSan and TSan.
  runtime:
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          tsan: 'true'
      - name: Runtime tests (ASan, UBSan, TSan)
        run: runtime/run_tests.sh

  # Compiler tests, split into shards that run in parallel. No JVM and no Gradle: every shard builds the native toolchain
  # (scripts/ci-toolchain.sh: the latest release's compiler builds the compiler, runtime and `mini` of this checkout, ~2 min)
  # and runs `mini test` / scripts/test-e2e.sh. The K2 cross-checks live in k2-oracle.yml (nightly, not per PR).
  compiler:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        # All shards on Linux; macOS runs every shard on main and only the platform-sensitive
        # ones (e2e, modules) on pull requests, since macOS runners are scarce.
        os: ${{ fromJSON(github.ref == 'refs/heads/main' && '["ubuntu-latest","macos-latest"]' || '["ubuntu-latest"]') }}
        # modules: purity + `mini test` of backend, frontend, native-driver (103 tests); mini-tool: `mini test` of the tool (72, slow: real builds);
        # e2e: scripts/test-e2e.sh (C backend, sanitizers, memory corpus); llvm: LLVM backend suites, the LLVM bootstrap and the LLVM C API;
        # stage0: bootstrap from the release, stage2 == stage3, then the `mini` smoke test.
        shard: ${{ fromJSON('["modules","mini-tool","e2e","llvm","stage0"]') }}
        include: ${{ fromJSON(github.ref == 'refs/heads/main' && '[]' || '[{"os":"macos-latest","shard":"e2e"},{"os":"macos-latest","shard":"modules"}]') }}
    name: compiler (${{ matrix.shard }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Toolchain
        if: matrix.shard != 'stage0'
        run: scripts/ci-toolchain.sh
      - name: LLVM 18 .deb cache key (Linux)
        id: llvmkey
        if: matrix.shard == 'llvm' && runner.os == 'Linux'
        # ImageOS / ImageVersion are runner env vars, not available in ${{ }} expressions, so the key is computed here from the
        # distro, architecture and the apt candidate version of llvm-18-dev: a new image or package version gets a fresh cache.
        run: |
          . /etc/os-release
          cand="$(apt-cache policy llvm-18-dev | awk '/Candidate:/ {print $2}')"
          key="llvm18-debs-${ID}-${VERSION_CODENAME}-$(dpkg --print-architecture)-${cand:-unknown}-v2"
          key="$(printf '%s' "$key" | tr -c '[:alnum:]._+\n-' '_')"
          echo "candidate=${cand}" >> "$GITHUB_OUTPUT"
          echo "key=${key}" >> "$GITHUB_OUTPUT"
          echo "cache key: ${key}"
      - name: LLVM 18 .deb cache (Linux)
        if: matrix.shard == 'llvm' && runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/llvm-debs
          key: ${{ steps.llvmkey.outputs.key }}
      - name: LLVM 18 (Linux)
        # LLVM C API headers and libLLVM for the in-memory backend (and the ORC JIT). The Ubuntu mirror is sometimes extremely
        # slow (35 s .. 34 min), so the .debs are cached (see the cache step above): a hit installs offline in seconds. A miss
        # downloads once with a generous timeout (plus one retry) and visible progress, and the result is saved to the cache.
        if: matrix.shard == 'llvm' && runner.os == 'Linux'
        timeout-minutes: 30
        env:
          DEB_DIR: ${{ runner.temp }}/llvm-debs
          LLVM_CANDIDATE: ${{ steps.llvmkey.outputs.candidate }}
        run: |
          set -o pipefail
          stamp() { while IFS= read -r l; do printf '%s %s\n' "$(date -u +%T)" "$l"; done; }
          export DEBIAN_FRONTEND=noninteractive
          APT_OPTS=(-y -q --no-install-recommends -o Dpkg::Progress-Fancy=0 -o Acquire::Retries=3 -o APT::Sandbox::User=root)
          # apt reads local .debs as the sandbox user _apt, which cannot read $RUNNER_TEMP (Ubuntu 26.04 image): install from
          # a world-readable copy (and APT::Sandbox::User=root in APT_OPTS, which also covers the download step)
          install_debs() {
            sudo rm -rf /var/cache/llvm-debs
            sudo install -d -m 755 /var/cache/llvm-debs
            sudo cp "$DEB_DIR"/*.deb /var/cache/llvm-debs/
            sudo chmod 644 /var/cache/llvm-debs/*.deb
            sudo timeout 300 apt-get install "${APT_OPTS[@]}" -o Acquire::Retries=0 /var/cache/llvm-debs/*.deb 2>&1 | stamp
          }
          if [ -x /usr/lib/llvm-18/bin/llvm-config ] && [ -f /usr/lib/llvm-18/include/llvm-c/Core.h ]; then
            echo "llvm-18-dev already installed"
          else
            mkdir -p "$DEB_DIR"
            installed=
            # 1. cache hit: install from the cached .debs only (no mirror access when the closure is complete)
            cached_ver=
            if ls "$DEB_DIR"/llvm-18-dev_*.deb >/dev/null 2>&1; then
              cached_ver="$(dpkg-deb -f "$(ls "$DEB_DIR"/llvm-18-dev_*.deb | head -n1)" Version 2>/dev/null || true)"
            fi
            if [ -n "$cached_ver" ] && [ "$cached_ver" != "$LLVM_CANDIDATE" ]; then
              echo "::warning::cached llvm-18-dev $cached_ver != candidate $LLVM_CANDIDATE; ignoring cached .debs"
              sudo rm -rf "$DEB_DIR"
              mkdir -p "$DEB_DIR"
            fi
            if ls "$DEB_DIR"/*.deb >/dev/null 2>&1; then
              echo "installing from cached .debs ($(ls "$DEB_DIR"/*.deb | wc -l) files)"
              if install_debs; then
                installed=1
              else
                echo "::warning::install from cached .debs failed; falling back to download"
                sudo dpkg --configure -a || true
              fi
            fi
            # 2. cache miss: download (no apt-get update first, the image index is usually fresh enough), one retry after
            #    an update restricted to the official Ubuntu sources
            if [ -z "$installed" ]; then
              for attempt in 1 2; do
                echo "::group::download llvm-18-dev, attempt $attempt ($(date -u +%T))"
                if [ "$attempt" = 2 ]; then
                  if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
                    sudo timeout 300 apt-get update -q -o Acquire::Retries=3 \
                      -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- \
                      -o APT::Get::List-Cleanup=0 2>&1 | stamp \
                      || sudo timeout 300 apt-get update -q -o Acquire::Retries=3 2>&1 | stamp || true
                  else
                    sudo timeout 300 apt-get update -q -o Acquire::Retries=3 2>&1 | stamp || true
                  fi
                fi
                if sudo timeout 1200 apt-get install --download-only "${APT_OPTS[@]}" \
                     -o Dir::Cache::archives="$DEB_DIR" llvm-18-dev 2>&1 | stamp; then
                  installed=dl
                fi
                echo "::endgroup::"
                echo "attempt $attempt finished at $(date -u +%T)"
                [ -n "$installed" ] && break
                sudo dpkg --configure -a || true
              done
              [ -n "$installed" ] || { echo "::error::llvm-18-dev download failed after 2 attempts"; exit 1; }
              # make the cache dir readable/saveable by the cache action (apt ran as root)
              sudo rm -f "$DEB_DIR/lock"
              sudo rm -rf "$DEB_DIR/partial"
              sudo chown -R "$(id -u):$(id -g)" "$DEB_DIR"
              install_debs
            fi
          fi
          echo "/usr/lib/llvm-18/bin" >> "$GITHUB_PATH"
          /usr/lib/llvm-18/bin/llvm-config --version
      - name: Tests (${{ matrix.shard }})
        run: |
          case "${{ matrix.shard }}" in
            modules)
              scripts/check-purity.sh
              (cd compiler && ../build/native/bin/mini test -p backend -p frontend -p native-driver) ;;
            mini-tool)
              (cd compiler && ../build/native/bin/mini test -p mini-tool) ;;
            e2e)
              scripts/test-e2e.sh ;;
            llvm)
              # LLVM C API headers and libLLVM come from the "LLVM 18 (Linux)" step above.
              if [ "$RUNNER_OS" = Linux ]; then
                export PATH="/usr/lib/llvm-18/bin:$PATH"
                llvm-config --version
              fi
              (cd compiler && ../build/native/bin/mini build -p native-driver)
              export NATIVE_DRIVER="$PWD/compiler/build/debug/native-driver"
              scripts/test-e2e.sh --suite llvm --suite llvm-leak --suite llvm-variants --suite fuzz-llvm --suite fuzz-llvm-leak
              if [ "$RUNNER_OS" = Linux ]; then
                # bootstrap through the LLVM backend, then through the LLVM C API; the API compiler runs the llvm-api suite
                # (stage0 = the compiler of this checkout that the Toolchain step built from the release)
                compiler/bootstrap.sh --backend=llvm "$RUNNER_TEMP/boot-llvm"
                compiler/bootstrap.sh --backend=llvm-api "$RUNNER_TEMP/boot-api"
                MINIC_API="$RUNNER_TEMP/boot-api/stage3" scripts/test-e2e.sh --suite llvm-api
              fi ;;
            # B3 from the latest release: native stage0 -> stage1 -> stage2 -> stage3, stage2 == stage3 byte for byte.
            # Then the native `mini` project tool is built by that stage3 compiler and smoke-tested:
            # mini new, build, run, test, check.
            stage0)
              scripts/ci-stage0.sh "$RUNNER_TEMP/stage0" && scripts/ci-mini-smoke.sh "$RUNNER_TEMP/stage0" ;;
          esac
      # The threaded programs of the e2e corpus with ThreadSanitizer over program and runtime (12 programs, ~2 min). The ASan/UBSan/LSan
      # runs of the whole corpus are the leak suites of the default `scripts/test-e2e.sh` above.
      - name: Thread programs under ThreadSanitizer
        if: matrix.shard == 'e2e' && runner.os == 'Linux'
        timeout-minutes: 15
        env:
          CC: clang
        run: scripts/test-e2e.sh --suite tsan
      - name: GNU GCC strict FP regression (C backend)
        if: matrix.shard == 'e2e' && runner.os == 'Linux'
        env:
          CC: gcc
        run: scripts/test-e2e.sh --suite c floats
      - name: Native REPL session tests (LLVM API)
        if: matrix.shard == 'llvm' && runner.os == 'Linux'
        timeout-minutes: 10
        env:
          MINIC_API: ${{ runner.temp }}/boot-api/stage3
        run: compiler/llvm-c/tests/repl-session.sh
      - name: ORC session API tests
        if: matrix.shard == 'llvm' && runner.os == 'Linux'
        timeout-minutes: 10
        env:
          MINIC_API: ${{ runner.temp }}/boot-api/stage3
        run: compiler/llvm-c/tests/session-api-smoke.sh

  # Single status for branch protection: green when every job that ran passed.
  ci-ok:
    if: always()
    needs: [changes, runtime, compiler]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          for r in "${{ needs.changes.result }}" "${{ needs.runtime.result }}" "${{ needs.compiler.result }}"; do
            case "$r" in success|skipped) ;; *) echo "a job ended with: $r"; exit 1 ;; esac
          done
