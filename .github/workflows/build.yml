name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# A new push to a pull request cancels the run of its previous head.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Which parts changed: docs-only changes skip the builds.
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      runtime: ${{ steps.filter.outputs.runtime }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            runtime:
              - 'runtime/**'
              - '.github/workflows/build.yml'
            code:
              - 'compiler/**'
              - 'stdlib/**'
              - 'stdlib-test/**'
              - 'runtime/**'
              - 'examples/**'
              - 'minic'
              - 'scripts/**'
              - '.github/workflows/build.yml'

  # libminirt under ASan/UBSan and TSan.
  runtime:
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          libuv: 'true'
      - name: Runtime tests (ASan, UBSan, TSan)
        run: runtime/run_tests.sh

  # Compiler tests, split into shards that run in parallel. The shards are defined by exclusion
  # (`-PtestExclude`), so a new test class always runs in one of them.
  compiler:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        # All shards on Linux; macOS runs every shard on main and only the platform-sensitive
        # ones (e2e, selfhost, modules) on pull requests, since macOS runners are scarce.
        os: ${{ fromJSON(github.ref == 'refs/heads/main' && '["ubuntu-latest","macos-latest"]' || '["ubuntu-latest"]') }}
        # `stage0` (bootstrap from the latest release's native compiler, ~1 min) runs everywhere; `bootstrap` (from the
        # JVM stage1, ~4 min, guards the K2 path) only on main.
        shard: ${{ fromJSON(github.ref == 'refs/heads/main' && '["modules","e2e","llvm","selfhost","bridge","oracle","frontend-selfhost","sema-selfhost","selfcompare","stage0","bootstrap"]' || '["modules","e2e","llvm","selfhost","bridge","oracle","frontend-selfhost","sema-selfhost","selfcompare","stage0"]') }}
        include: ${{ fromJSON(github.ref == 'refs/heads/main' && '[]' || '[{"os":"macos-latest","shard":"e2e"},{"os":"macos-latest","shard":"selfhost"},{"os":"macos-latest","shard":"modules"}]') }}
    name: compiler (${{ matrix.shard }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Tests (${{ matrix.shard }})
        working-directory: compiler
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "${{ matrix.shard }}" in
            modules)           args=(test -x :jvm-bridge:test -x :frontend-oracle:test) ;;
            e2e)               args=(:jvm-bridge:test --tests EndToEndTest) ;;
            selfhost)          args=(:jvm-bridge:test --tests SelfHostTest) ;;
            llvm)              args=(:jvm-bridge:test --tests LlvmEndToEndTest) ;;
            bridge)            args=(:jvm-bridge:test -PtestExclude=EndToEndTest,SelfHostTest,LlvmEndToEndTest) ;;
            oracle)            args=(:frontend-oracle:test -PtestExclude=FrontendSelfHostTest,SemaSelfHostTest) ;;
            frontend-selfhost) args=(:frontend-oracle:test --tests FrontendSelfHostTest) ;;
            sema-selfhost)     args=(:frontend-oracle:test --tests SemaSelfHostTest) ;;
            # Self-compile MIR, own frontend vs K2: the normalised diff must not exceed selfcompare-baseline.txt.
            selfcompare)       ./gradlew :jvm-bridge:installDist --console=plain && python3 selfcompare.py; exit ;;
            # B3 from the latest release: native stage0 -> stage1 -> stage2 -> stage3 without JVM and K2.
            # Falls back to the JVM stage1 when there is no release (yet) or the download fails.
            stage0)            ../scripts/ci-stage0.sh "$RUNNER_TEMP/stage0"; exit ;;
            # B3: stage1 -> stage2 -> stage3 without K2, stage2 == stage3 byte for byte.
            bootstrap)         ./gradlew :jvm-bridge:installDist --console=plain && ./bootstrap.sh "$RUNNER_TEMP/b3"; exit ;;
          esac
          ./gradlew "${args[@]}" --console=plain

  # Single status for branch protection: green when every job that ran passed.
  ci-ok:
    if: always()
    needs: [changes, runtime, compiler]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          for r in "${{ needs.changes.result }}" "${{ needs.runtime.result }}" "${{ needs.compiler.result }}"; do
            case "$r" in success|skipped) ;; *) echo "a job ended with: $r"; exit 1 ;; esac
          done
