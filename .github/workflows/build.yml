name: Build and test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: '3.1.2'
      - name: Check native code generator
        run: clang --version
      - name: Configure portable compiler
        run: xmake f -c --llvm=n -y
      - name: Build
        run: xmake -y
      - name: Unit and native integration tests
        run: xmake test -y
